version: '3.8'
services:
  db:
    image: postgres:15
    container_name: nevo-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nevo              # 팀원 설정과 일치
      POSTGRES_USER: nevo            # 팀원 설정과 일치
      POSTGRES_PASSWORD: nevo_backend # 팀원 설정과 일치
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: