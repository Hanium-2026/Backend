spring:
  application:
    name: nevo

  # 데이터베이스 연결 설정
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nevo}
    username: ${DB_USERNAME:nevo}
    password: ${DB_PASSWORD:nevo_backend}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway가 스키마 관리, JPA는 검증만
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Flyway 마이그레이션 설정
  flyway:
    enabled: true
    locations: classpath:db/migration

  # 이메일 발송 설정 (비밀번호 재설정용)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:nevo123@gmail.com} # 필수 입력: 발송자 Gmail 계정: 변경필요
    password: ${MAIL_PASSWORD:nevo123!}          # 필수 입력: Gmail 앱 비밀번 계정호 16자리: 변경 필요
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# JWT 설정
jwt:
  secret: ${JWT_SECRET:nevo-walkcare-dev-secret-key-must-be-at-least-32-bytes} # 필수 입력: 32자 이상의 랜덤 문자열 (토큰 서명 키): 변경필요
  access-expiration: 3600000         # 액세스 토큰 만료: 1시간 (ms)
  refresh-expiration: 2592000000     # 리프레시 토큰 만료: 30일 (ms)

# Swagger UI 경로 설정
springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
  api-docs:
    path: /v3/api-docs
