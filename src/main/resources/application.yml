spring:
  application:
    name: nevo

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nevo}
    username: ${DB_USERNAME:nevo}
    password: ${DB_PASSW:nevo_backend}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true # 콘솔에 찍히는 쿼리를 보기 좋게 정렬해 줍니다. (추가 권장)

  flyway:
    enabled: true
    locations: classpath:db/migration