spring:
  application:
    name: nevo

  # 데이터베이스 연결 설정
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nevo}
    username: ${DB_USERNAME:nevo}
    password: ${DB_PASSWORD:nevo_backend  }
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway가 스키마 관리, JPA는 검증만
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Flyway 마이그레이션 설정
  flyway:
    enabled: true
    locations: classpath:db/migration

  # Redis 설정 (OTP 저장용)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}   # 로컬 개발 환경은 비워도 됨

# JWT 설정
jwt:
  secret: ${JWT_SECRET:nevo-walkcare-dev-secret-key-must-be-at-least-32-bytes} # 필수 입력: 32자 이상의 랜덤 문자열 (토큰 서명 키): 변경필요
  access-expiration: 1800000         # 액세스 토큰 만료: 30분 (ms)
  refresh-expiration: 2592000000     # 리프레시 토큰 만료: 30일 (ms)

# Firebase FCM 설정
firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}

# Swagger UI 경로 설정
springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
  api-docs:
    path: /v3/api-docs
