services:
  db:
    image: postgres:15
    container_name: nevo-db
    restart: always
    environment:
      POSTGRES_DB: nevo
      POSTGRES_USER: nevo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: nevo-redis
    restart: always

  app:
    image: 559487953874.dkr.ecr.eu-north-1.amazonaws.com/nevo-backend:latest
    container_name: nevo-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: nevo
      DB_USERNAME: nevo
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - db
      - redis

volumes:
  postgres-data:
